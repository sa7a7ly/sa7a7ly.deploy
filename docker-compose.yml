version: "3.8"

services:

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  worker:
    build: ./backend
    command: node workers/gradingWorker.js
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
